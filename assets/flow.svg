<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="How it works: when a session starts, the SessionStart hook detects the stack; when you edit something risky, the PostToolUse hook warns once; before you finish, the security-checklist skill reviews control by control. Verdicts: BLOCK if a P0 fails, PASS WITH ISSUES if something cannot be verified or a P1/P2 fails, PASS if everything is met or justified as N/A.">
  <style>
    .s { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .n { font-size: 13px; font-weight: 700; fill: #10b981; letter-spacing: .08em; }
    .t { font-size: 18px; font-weight: 700; fill: #e6edf3; }
    .c { font-size: 12.5px; fill: #79c0ff; }
    .d { font-size: 13.5px; fill: #9da7b3; }
    .v { font-size: 13px; font-weight: 700; }
  </style>
  <rect width="880" height="380" rx="14" fill="#0b1220"/>
  <rect x=".5" y=".5" width="879" height="379" rx="14" fill="none" stroke="#30363d"/>

  <!-- three steps -->
  <g class="s">
    <rect x="24" y="24" width="256" height="180" rx="12" fill="#111827" stroke="#30363d"/>
    <text x="44" y="56" class="n">1 · SESSION STARTS</text>
    <text x="44" y="86" class="t">Detects the stack</text>
    <text x="44" y="110" class="m c">hook SessionStart</text>
    <text x="44" y="142" class="d">Firebase, Supabase, mobile,</text>
    <text x="44" y="162" class="d">Stripe, Next, API, LLM…</text>
    <text x="44" y="182" class="d">and names the standards.</text>

    <rect x="312" y="24" width="256" height="180" rx="12" fill="#111827" stroke="#30363d"/>
    <text x="332" y="56" class="n">2 · RISKY EDIT</text>
    <text x="332" y="86" class="t">Warns once</text>
    <text x="332" y="110" class="m c">hook PostToolUse</text>
    <text x="332" y="142" class="d">Auth, roles, payments, rules,</text>
    <text x="332" y="162" class="d">secrets, uploads, CORS…</text>
    <text x="332" y="182" class="d">Never blocks.</text>

    <rect x="600" y="24" width="256" height="180" rx="12" fill="#111827" stroke="#10b981" stroke-opacity=".6"/>
    <text x="620" y="56" class="n">3 · BEFORE DONE</text>
    <text x="620" y="86" class="t">Reviews with evidence</text>
    <text x="620" y="110" class="m c">secdev:security-checklist</text>
    <text x="620" y="142" class="d">P0 / P1 / P2, one control</text>
    <text x="620" y="162" class="d">at a time, each with file:line.</text>
    <text x="620" y="182" class="d">No evidence, no ✓.</text>
  </g>

  <!-- arrows -->
  <path d="M284 114 H306 M300 108 L306 114 L300 120" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M572 114 H594 M588 108 L594 114 L588 120" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- verdicts -->
  <text x="24" y="246" class="s" style="font-size:13px;font-weight:700;fill:#7d8590;letter-spacing:.08em">VERDICT</text>
  <g class="s">
    <rect x="24" y="262" width="256" height="92" rx="12" fill="#f85149" fill-opacity=".1" stroke="#f85149" stroke-opacity=".7"/>
    <text x="44" y="294" class="v" fill="#ff7b72">BLOCK</text>
    <text x="44" y="320" class="d">An applicable P0 is not met.</text>
    <text x="44" y="340" class="d">Do not release.</text>

    <rect x="312" y="262" width="256" height="92" rx="12" fill="#d29922" fill-opacity=".1" stroke="#d29922" stroke-opacity=".7"/>
    <text x="332" y="294" class="v" fill="#e3b341">PASS WITH ISSUES</text>
    <text x="332" y="320" class="d">Something cannot be verified</text>
    <text x="332" y="340" class="d">from the code, or a P1 / P2 fails.</text>

    <rect x="600" y="262" width="256" height="92" rx="12" fill="#3fb950" fill-opacity=".1" stroke="#3fb950" stroke-opacity=".7"/>
    <text x="620" y="294" class="v" fill="#56d364">PASS</text>
    <text x="620" y="320" class="d">Everything that applies is met</text>
    <text x="620" y="340" class="d">or justified as N/A.</text>
  </g>
</svg>
