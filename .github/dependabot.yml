version: 2
updates:
  # Mantiene al día los SHA fijados en .github/workflows (y su comentario de versión).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # No propone una versión hasta que lleve 7 días publicada: margen ante una release comprometida.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
