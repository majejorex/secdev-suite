version: 2
updates:
  # Keeps the SHAs pinned in .github/workflows up to date (and their version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Does not propose a version until it has been published for 7 days: a margin against a compromised release.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
